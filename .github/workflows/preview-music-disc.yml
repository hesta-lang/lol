name: Preview music disc replacement (HD + UHD)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create HD and UHD previews
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          import json

          out = Path("music-disc-preview")
          out.mkdir(exist_ok=True)
          reports = []

          def make_preview(filename, tag):
              src = Path(filename)
              if not src.exists():
                  raise SystemExit(f"Missing source image: {filename}")
              original = Image.open(src).convert("RGBA")
              w, h = original.size
              # Proportional placement works for both HD and UHD dimensions.
              cx, cy = w // 2, h // 2
              radius = round(min(w, h) * 0.255)
              layer = Image.new("RGBA", original.size, (0, 0, 0, 0))
              d = ImageDraw.Draw(layer)

              # Opaque vinyl masks the M; the original file remains unchanged.
              d.ellipse((cx-radius, cy-radius, cx+radius, cy+radius),
                        fill=(12, 14, 17, 255),
                        outline=(245, 245, 245, 255), width=max(1, round(min(w,h)*0.009)))
              scale = min(w, h) / 188
              for rr, color in [
                  (0.89, (65, 69, 73, 255)),
                  (0.81, (35, 38, 42, 255)),
                  (0.68, (73, 77, 80, 255)),
                  (0.57, (34, 37, 41, 255)),
              ]:
                  r = round(radius * rr)
                  d.ellipse((cx-r, cy-r, cx+r, cy+r),
                            outline=color, width=max(1, round(scale)))
              d.arc((cx-round(radius*.90), cy-round(radius*.90),
                     cx+round(radius*.90), cy+round(radius*.90)),
                    205, 320, fill=(190, 194, 198, 255), width=max(1, round(scale)))
              label_r = round(radius * 0.44)
              d.ellipse((cx-label_r, cy-label_r, cx+label_r, cy+label_r),
                        fill=(142, 242, 48, 255),
                        outline=(245, 245, 245, 255), width=max(1, round(scale)))
              inner = round(radius * 0.26)
              d.ellipse((cx-inner, cy-inner, cx+inner, cy+inner),
                        outline=(44, 94, 23, 255), width=max(1, round(scale*1.5)))
              hole = max(2, round(radius * 0.08))
              d.ellipse((cx-hole, cy-hole, cx+hole, cy+hole), fill=(12, 14, 17, 255))

              result = Image.alpha_composite(original, layer)
              result.save(out / f"MH_menu-{tag}-disc-preview.png")
              result.resize((w*3, h*3), Image.Resampling.NEAREST).save(
                  out / f"MH_menu-{tag}-disc-preview-3x.png")
              original.save(out / f"MH_menu-{tag}-original-unchanged.png")
              reports.append({"file": filename, "size": [w,h], "center": [cx,cy], "radius": radius})
          
          make_preview("MH_menu-hd.png", "hd")
          make_preview("MH_menu-uhd.png", "uhd")
          (out / "README.txt").write_text(
              "Preview only: both original HD and UHD files remain unchanged. "
              "The disc is opaque and proportionally centered to cover the existing M. "
              "Review both *-disc-preview-3x.png images before replacing either original.\n",
              encoding="utf-8"
          )
          print(json.dumps(reports, indent=2))
          PY

      - name: Upload preview files
        uses: actions/upload-artifact@v4
        with:
          name: music-disc-replacement-preview-hd-uhd
          path: music-disc-preview/
          if-no-files-found: error
          retention-days: 7
